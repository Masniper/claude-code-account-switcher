[package]
name = "claude-acc-manager"
version = "0.1.0"
edition = "2024"
# Higher than the root crate's 1.89 (`File::lock`): the locked `tauri` 2.12,
# `tauri-build`, `tauri-runtime` and `muda` each declare `rust-version = "1.90"`
# (read from `cargo metadata`). Declared so an older toolchain names the
# compiler it needs instead of failing inside a dependency.
rust-version = "1.90"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
claude-acc = { path = "../../.." }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
rfd = "0.15"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
serde_json = "1"

[profile.release]
strip = true
